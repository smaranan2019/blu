# ── Cargo hold · projects ────────────────────────────────────
# Newest first. Each project can have its own photo folder: images/projects/<slug>/
# Add as many photos as you like; they become a swipeable carousel.
# `bullets` are optional key points shown under the summary.
projects:
  - title: "Holmes — Self-Service Triage Portal"
    client: "JPMorgan Chase · internal tool"
    summary: "Replaces a manual runbook. Paste in a log or error, and it tells you whether the fix sits with the client, the data setup or the platform."
    bullets:
      - "A rules engine built from the ~50 production tickets I'd triaged and closed classifies the failure, then verifies it live against 7 internal APIs. The authorization pipeline is modelled as 5 stages, so it pinpoints which hop failed and which system owns the data."
      - "Auth runs on the caller's own ADFS token, so the service stores no secrets."
      - "Safe under concurrent load: a shared, pooled HTTP client removed a 50–200 ms TLS handshake from every upstream call; bounded fan-out and request threads, and token caching with an AD-lockout guard, let it scale out by adding pods."
      - "Request IDs shown to users, structured logs for every upstream call, and real 5xx responses, so failures show up in metrics instead of hiding behind HTTP 200s. 117 offline tests seeded from redacted production payloads."
    tags: [Python, FastAPI, httpx, ADFS / OAuth2, Vanilla JS, pytest, Kubernetes, Datadog APM, Splunk]

  - title: "Payment Ops & Work Dashboards — Automated Reporting Pipeline"
    client: "JPMorgan Chase · internal tool"
    summary: "A data-as-code reporting pipeline: one JSON source of truth renders into a self-contained HTML dashboard (support requests, code changes and incidents by volume, root causes, SLA/latency, open items), used live in team meetings to drive product-health discussions. Saves 2–3 hours of manual reporting a fortnight (about 50–75 hours a year) and keeps the numbers consistent and audit-ready."
    bullets:
      - "Validated, idempotent publish path: a validation gate rejects malformed data (bad months, products or outcomes, duplicates, mismatched arrays), and an anchored regex swaps only a delimited DATA block, one record per line so diffs stay reviewable."
      - "Publishes to Confluence over the REST API with PAT auth, with a --dry-run mode."
      - "GitHub Copilot (MCP) pulls the latest payment state from the internal ticketing system and publishes it: one engine serving a team Ops Dashboard and a personal Work Dashboard."
    tags: [Python, requests, Confluence REST API, Vanilla JS, HTML, GitHub Copilot, MCP]

  - title: "Snif — Singapore Haze Widget"
    client: "Personal project · iOS & Android"
    summary: "A pixel-art iOS and Android widget where Milk Tea the capybara shows Singapore's live haze level, from NEA air-quality data."
    bullets:
      - "Native on both platforms: SwiftUI + WidgetKit on iOS, Jetpack Compose + Glance on Android."
      - "One tested core shared by the app and the widget, with explicit no-data and stale states, so unknown air is never shown as safe."
    tags: [Swift, Kotlin, SwiftUI, Jetpack Compose, WidgetKit, Glance, REST API, CI]

  - title: "Credit Card Rewards System"
    client: "Ascenda · university project"
    date: "Jul 2023"
    summary: "Full-stack AWS application (React + Spring Boot) managing 10K+ daily transactions, reducing point-redemption latency by 40%. CI/CD with CodePipeline and automated fraud checks on Lambda."
    tags: [React, Spring Boot, AWS, Lambda, CodePipeline]
    photos:
      - images/projects/rewards/1.svg
      - images/projects/rewards/2.svg

  - title: "VR Market Sentiment Dashboard"
    client: "SafeVR · university project"
    date: "Oct 2022"
    summary: "Real-time sentiment analysis tool (Python, AWS Lambda) tracking 1K+ VR user reviews, guiding feature prioritisation for 5+ product teams."
    tags: [Python, AWS Lambda, NLP]
    photos:
      - images/projects/safevr/1.svg

